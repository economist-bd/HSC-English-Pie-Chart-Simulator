<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HSC Chart & Paragraph Simulator</title>
    <meta property="og:title" content="HSC English Graph & Chart Simulator | Interactive Learning Tool" />
<meta property="og:description" content="এইচএসসি ইংরেজি ১ম পত্রের Graph & Chart (Q.10/11) প্র্যাকটিস করার জন্য সেরা টুল। ডেটা ইনপুট দিলেই তৈরি হবে চার্ট এবং অটোমেটিক প্যারাগ্রাফ!" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://hsc-english-pie-chart-simulator.vercel.app/" />
<meta property="og:image" content="https://i.imgur.com/YOUR_IMAGE_LINK.jpg" /> ```
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60; /* Color changed to Greenish for freshness */
            --bg: #f4f7f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 { text-align: center; color: var(--primary); margin-bottom: 5px; }
        .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }
        
        .control-panel {
            background: #ecf0f1;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            align-items: center;
        }
        
        select, input {
            padding: 10px;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            font-size: 15px;
        }
        select { font-weight: bold; color: var(--primary); }

        button {
            padding: 10px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.3s;
        }
        button:hover { background-color: #34495e; }
        button.reset { background-color: #e74c3c; }
        button.reset:hover { background-color: #c0392b; }
        
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin-top: 20px;
        }
        @media (min-width: 768px) {
            .main-content { flex-direction: row; }
        }
        
        .chart-box {
            flex: 1;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .text-box {
            flex: 1;
            background: #fff;
            padding: 20px;
            border: 1px solid #eee;
            border-radius: 8px;
            border-top: 5px solid var(--accent);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .text-box h3 { margin-top: 0; color: var(--primary); }
        #paragraph-output {
            line-height: 1.8;
            font-size: 16px;
            text-align: justify;
            color: #444;
        }
        
        /* Table Styles */
        .table-container { overflow-x: auto; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: var(--primary); color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body>

<div class="container">
    <h2>HSC Graph & Chart Simulator</h2>
    <p class="subtitle">Interactive Tool for Economics & English Students</p>
    
    <div class="control-panel">
        <select id="chartType" onchange="renderChart(); generateParagraph();">
            <option value="pie">Pie Chart</option>
            <option value="bar">Bar Chart</option>
        </select>
        <input type="text" id="labelInput" placeholder="Category (e.g. Literacy Rate)">
        <input type="number" id="dataInput" placeholder="Value % (e.g. 65)">
        <button onclick="addData()">Add Data</button>
        <button class="reset" onclick="resetChart()">Reset All</button>
    </div>

    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Category / Year</th>
                    <th>Value / Percentage</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>

    <div class="main-content">
        <div class="chart-box">
            <canvas id="myChart"></canvas>
        </div>

        <div class="text-box">
            <h3>Generated Description:</h3>
            <p id="paragraph-output">Input data to generate the paragraph...</p>
        </div>
    </div>
</div>

<script>
    let labels = [];
    let dataValues = [];
    let myChartObj = null;
    const ctx = document.getElementById('myChart').getContext('2d');

    // Color Palette
    const colors = [
        '#3498db', '#e74c3c', '#f1c40f', '#2ecc71', '#9b59b6', '#34495e', '#16a085', '#d35400'
    ];

    function renderChart() {
        // Destroy previous instance to switch types
        if (myChartObj) myChartObj.destroy();

        const chartType = document.getElementById('chartType').value;
        
        // Configuration Logic
        let chartConfig = {
            type: chartType,
            data: {
                labels: labels,
                datasets: [{
                    label: 'Data Value',
                    data: dataValues,
                    backgroundColor: chartType === 'pie' ? colors : '#3498db', // Single color for bars looks cleaner or array for multi
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: chartType === 'pie', // Hide legend for bar chart usually
                        position: 'bottom'
                    }
                },
                scales: {
                    // Y-axis is only needed for Bar Chart
                    y: {
                        beginAtZero: true,
                        display: chartType === 'bar'
                    },
                    x: {
                        display: chartType === 'bar'
                    }
                }
            }
        };

        myChartObj = new Chart(ctx, chartConfig);
    }

    function addData() {
        const label = document.getElementById('labelInput').value;
        const value = parseFloat(document.getElementById('dataInput').value);

        if (label && !isNaN(value)) {
            labels.push(label);
            dataValues.push(value);

            // Add row to table
            const tableBody = document.querySelector('#dataTable tbody');
            const row = `<tr><td>${label}</td><td>${value}</td></tr>`;
            tableBody.insertAdjacentHTML('beforeend', row);

            // Clear inputs
            document.getElementById('labelInput').value = '';
            document.getElementById('dataInput').value = '';

            renderChart();
            generateParagraph();
        } else {
            alert("Please enter valid category and numerical value.");
        }
    }

    function resetChart() {
        labels = [];
        dataValues = [];
        document.querySelector('#dataTable tbody').innerHTML = '';
        document.getElementById('paragraph-output').innerText = 'Input data to generate the paragraph...';
        if (myChartObj) myChartObj.destroy();
    }

    // Advanced Paragraph Generator
    function generateParagraph() {
        if (labels.length === 0) return;

        const chartType = document.getElementById('chartType').value;
        const chartName = chartType === 'pie' ? "pie chart" : "bar chart";
        
        let maxVal = Math.max(...dataValues);
        let minVal = Math.min(...dataValues);
        let maxIndex = dataValues.indexOf(maxVal);
        let minIndex = dataValues.indexOf(minVal);

        // Dynamic Intro based on chart type
        let text = `The ${chartName} illustrates the comparative data of the selected categories. The data is presented in a structured manner to highlight the variations. <br><br>`;

        // Body Paragraph
        text += `Analyzing the ${chartName}, it is clearly observed that <strong>${labels[maxIndex]}</strong> holds the highest position with a value of <strong>${maxVal}</strong>. In contrast, <strong>${labels[minIndex]}</strong> represents the lowest figures, standing at only <strong>${minVal}</strong>. This indicates a significant gap between the highest and lowest parameters. <br><br>`;

        // Details
        text += `Furthermore, looking at the other data points, `;
        let otherPoints = [];
        for (let i = 0; i < labels.length; i++) {
            if (i !== maxIndex && i !== minIndex) {
                otherPoints.push(`<strong>${labels[i]}</strong> accounts for <strong>${dataValues[i]}</strong>`);
            }
        }
        
        if(otherPoints.length > 0){
             text += otherPoints.join(', ') + `. These figures show the moderate levels within the dataset. `;
        } else {
            text += `there are no other intermediate categories. `;
        }

        // Conclusion
        text += `<br><br>In conclusion, the ${chartName} reveals that ${labels[maxIndex]} dominates the chart, while ${labels[minIndex]} remains the least significant aspect among the given variables.`;

        document.getElementById('paragraph-output').innerHTML = text;
    }
</script>

</body>
</html>
